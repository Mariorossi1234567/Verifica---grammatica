<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Verifica di analisi logica</title><style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2433;--mut:#5b6577;--line:#d5dae3;--acc:#24509b;--ok:#1e7a46;--okb:#e6f4ec;--ko:#b3261e;--kob:#fbe9e7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141821;--card:#1c2230;--ink:#e8ebf2;--mut:#9aa4b8;--line:#333f57;--acc:#8fb1ee;--ok:#6fd39b;--okb:#17301f;--ko:#ff9a92;--kob:#3a1c1a}}
*{box-sizing:border-box}
:root[data-theme="dark"]{--bg:#141821;--card:#1c2230;--ink:#e8ebf2;--mut:#9aa4b8;--line:#333f57;--acc:#8fb1ee;--ok:#6fd39b;--okb:#17301f;--ko:#ff9a92;--kob:#3a1c1a}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
main{max-width:920px;margin:0 auto}
h1{font:700 1.6rem Georgia,serif;margin:.2em 0}
.top,.card,.res{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px}
.top p{margin:.3em 0;color:var(--mut)}
label{font-weight:600}
label small{font-weight:400;color:var(--mut)}
#nome{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:min(320px,100%)}
.card h3{margin:0 0 8px;font-size:1rem;color:var(--acc)}
.fr{display:flex;flex-wrap:wrap;gap:8px 10px}
.ch{display:flex;flex-direction:column;gap:3px}
.ch span.t{font:1.05rem Georgia,serif;padding:0 2px}
select{font:inherit;font-size:.85rem;padding:4px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);max-width:190px}
select:focus-visible,button:focus-visible,#nome:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.ok select{border-color:var(--ok);background:var(--okb)}
.ko select{border-color:var(--ko);background:var(--kob)}
.k{font-size:.8rem;color:var(--ko);font-weight:600}
.bar{position:sticky;bottom:0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
button{font:inherit;font-weight:600;padding:8px 16px;border-radius:6px;border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer}
button.s{background:transparent;color:var(--acc)}
button:disabled{opacity:.5;cursor:default}
.res{display:none;border-color:var(--acc)}
.res strong{font-size:1.3rem}
@media print{.bar{display:none}body{background:#fff;color:#000}}
textarea{width:100%;font:.9rem monospace;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
details{margin:2px 0}summary{cursor:pointer;color:var(--acc)}.e{font-size:.9rem;color:var(--mut);margin:2px 0 2px 16px}</style></head><body><main><h1>Verifica di analisi logica</h1>
<div class="top"><p>Per ogni parte della frase scegli dal menu la funzione logica. Alla fine premi "Consegna": non vedrai il punteggio, che ti sarà comunicato dall'insegnante.</p>
<p><label for="nome">Nome <small>(solo nome e iniziale del cognome)</small></label> <input id="nome" autocomplete="off" placeholder="Es. Marco R."></p></div>
<div id="q"></div><div class="res" id="conf"></div><div class="res" id="res"></div>
<div class="bar"><span id="prog"></span><button id="go">Consegna la verifica</button></div></main>
<script>const L={S:"Soggetto",PV:"Predicato verbale",PN:"Predicato nominale",O:"Compl. oggetto",Sp:"Compl. di specificazione",D:"Compl. di denominazione",T:"Compl. di termine",Pt:"Compl. partitivo",Ag:"Compl. d'agente",Ce:"Compl. di causa efficiente",C:"Compl. di causa",F:"Compl. di fine",Mz:"Compl. di mezzo",Md:"Compl. di modo",Cp:"Compl. di compagnia o unione",Ls:"Compl. di luogo (stato in luogo)",La:"Compl. di luogo (moto a luogo)",Ld:"Compl. di luogo (moto da luogo)",Lp:"Compl. di luogo (moto per luogo)",Td:"Compl. di tempo determinato",Tc:"Compl. di tempo continuato",Ar:"Compl. di argomento",Li:"Compl. di limitazione",Pa:"Compl. di paragone",Ma:"Compl. di materia",Q:"Compl. di qualità",Ab:"Compl. di abbondanza",Pr:"Compl. di privazione",St:"Compl. di stima",Pz:"Compl. di prezzo",Et:"Compl. di età",Ps:"Compl. predicativo del soggetto",Pe:"Compl. di peso",Es:"Compl. di estensione",Di:"Compl. di distanza",Al:"Compl. di allontanamento o separazione"};const K=Object.keys(L);
const GR=[["Soggetto e predicato", ["S", "PV", "PN", "Ps"]], ["Oggetto e termine", ["O", "T"]], ["Specificazione e simili", ["Sp", "D", "Pt", "Ar", "Li", "Pa"]], ["Materia, qualità, misure, valore", ["Ma", "Q", "Pe", "Es", "Di", "Ab", "Pr", "St", "Pz"]], ["Causa, fine, modo, mezzo", ["C", "Ce", "Ag", "F", "Mz", "Md", "Cp"]], ["Luogo e allontanamento", ["Ls", "La", "Ld", "Lp", "Al"]], ["Tempo ed età", ["Td", "Tc", "Et"]]];
const D=`Mio nonno|a ottant'anni|cammina|per tre chilometri|ogni mattina
Il corriere|ha consegnato|un pacco|da cinque chili|a Marco|ieri
La scuola|si trova|in campagna|a due chilometri|da casa mia
Il bosco|si estende|per due ettari|ai piedi|della montagna
Mia sorella|è più brava|di me|in storia|quest'anno
Il gioielliere|ha venduto|un anello|d'oro|a mille euro|al cliente
Il perito|ha stimato|un quadro|di grande valore|a duemila euro
Il professore|parla|della Resistenza|agli studenti|per un'ora
Luca|è più bravo|di Marco|in geografia
Una ragazza|dai capelli biondi|compra|un maglione|di lana|a trenta euro
Un ragazzo|dagli occhi verdi|discute|del progetto|con la preside
Gli esperti|hanno stimato|il castello|a dieci milioni|nel 2018
Il paese|di mia nonna|dista|venti chilometri|da Bologna
Il viaggiatore|porta|uno zaino|del peso di dodici chili|sulle spalle
Mia madre|ha comprato|una sciarpa|di seta|dai colori vivaci|a venti euro
Marco|a quindici anni|porta|uno zaino|da dieci chili|a scuola
Gli operai|hanno costruito|un ponte|in ferro|durante l'estate|con grande cura
L'antiquario|ha valutato|il vaso|cinquecento euro|con una lente
Il negoziante|vende|il pane|a due euro|ai clienti|ogni mattina
Questa borsa|di pelle|è più cara|della mia
Il maestro|racconta|una storia|sui pirati|agli alunni
Mio zio|a vent'anni|ha camminato|per trenta chilometri|verso il mare
Il pacco|dello zio|pesa|tre chili
La casa|dei nonni|si trova|a trenta chilometri|dal mare|in campagna
Il bambino|a sette anni|è molto bravo|nel disegno
L'orologio|d'argento|costa|cento euro|in negozio
I periti|hanno valutato|una collezione|di grande pregio|a tre milioni
Giulia|è più veloce|di me|nella corsa
Il rifugio|si trova|a venti chilometri|dal paese|in alta montagna
Mia nonna|ha|una collana|d'oro|di grande pregio|da molti anni
Il corridore|porta|uno zaino|da otto chili|per dieci chilometri|lungo il fiume
La scuola|di mio fratello|dista|due chilometri|dal centro
Il notaio|valuta|la villa|un milione di euro|con attenzione
Il bambino|ha pagato|il gelato|due euro|al gelataio
Il museo|ha acquistato|un vaso|di porcellana|per mille euro|nel 2019
Una signora|dai capelli bianchi|racconta|ai nipoti|una storia|sul mare
Mia nonna|a novant'anni|è molto lucida|nei ricordi
Il mio zaino|di tela|è più caro|del tuo
Un ragazzo|di quindici anni|corre|per dieci chilometri|ogni sera
La professoressa|racconta|agli alunni|di Cipro|per due ore|in aula magna`.split("\n").map(r=>r.split("|"));
const enc=i=>i<26?String.fromCharCode(97+i):String.fromCharCode(65+i-26);
const opts='<option value="">— scegli —</option>'+GR.map(([g,ks])=>`<optgroup label="${g}">`+ks.map(k=>`<option value="${k}">${L[k]}</option>`).join("")+`</optgroup>`).join("");
const tot=D.reduce((n,f)=>n+f.length,0);
document.getElementById("q").innerHTML=D.map((f,i)=>`<div class="card"><h3>Frase ${i+1}</h3><div class="fr">${f.map((c,j)=>`<div class="ch"><span class="t">${c}</span><select aria-label="Frase ${i+1}: ${c}">${opts}</select></div>`).join("")}</div></div>`).join("");
const sels=[...document.querySelectorAll("select")],prog=document.getElementById("prog");
const upd=()=>prog.textContent=`Risposte: ${sels.filter(s=>s.value).length} / ${tot}`;
sels.forEach(s=>s.addEventListener("change",upd));upd();
const go=document.getElementById("go"),box=document.getElementById("conf");
function msg(h){box.innerHTML=h;box.style.display="block";box.scrollIntoView({block:"center"})}
go.onclick=function(){
const nome=document.getElementById("nome").value.trim();
if(!nome){msg("<p>Inserisci il tuo nome e l'iniziale del cognome.</p>");document.getElementById("nome").focus();return}
const v=sels.filter(s=>!s.value).length;
msg("<p>"+(v?"Ci sono "+v+" risposte vuote. Consegnare comunque?":"Consegnare la verifica? Non potrai modificarla.")+'</p><button id="si">Sì, consegna</button> <button class="s" id="no">No, torno a controllare</button>');
document.getElementById("no").onclick=()=>{box.style.display="none"};
document.getElementById("si").onclick=()=>finish(nome);
};
function finish(nome){
box.style.display="none";
const code=sels.map(s=>s.value?enc(K.indexOf(s.value)):"-").join("");
sels.forEach(s=>s.disabled=true);go.disabled=true;
const r=document.getElementById("res");r.style.display="block";
r.innerHTML='<strong>Verifica completata</strong><p>Copia questo codice e invialo all\'insegnante come ti ha indicato.</p><textarea id="cod" rows="3" readonly></textarea><p><button id="cp">Copia il codice</button></p>';
const t=document.getElementById("cod");t.value=nome.replace(/\|/g,"/")+" | "+code;
document.getElementById("cp").onclick=()=>{t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand("copy")}};
r.scrollIntoView({behavior:"smooth"});}
</script></body></html>
